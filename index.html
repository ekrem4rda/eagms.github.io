<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ekrem Arda Gümüş</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #0a0a14;
  }
  .bg {
    position: fixed;
    inset: 0;
    overflow: hidden;
    filter: blur(80px);
  }
  .blob {
    position: absolute;
    width: 50vmax;
    height: 50vmax;
    border-radius: 50%;
    opacity: .8;
    animation: float 18s ease-in-out infinite alternate;
  }
  .b1 { background: #ff3d81; top: -10%; left: -10%; }
  .b2 { background: #3d7bff; bottom: -15%; right: -10%; animation-duration: 22s; animation-delay: -6s; }
  .b3 { background: #8a3dff; top: 30%; left: 35%; animation-duration: 26s; animation-delay: -12s; }
  .b4 { background: #3dffc8; top: -15%; right: 5%; width: 35vmax; height: 35vmax; animation-duration: 20s; animation-delay: -3s; }
  @keyframes float {
    0%   { transform: translate(0, 0) scale(1); }
    50%  { transform: translate(25vw, 15vh) scale(1.2); }
    100% { transform: translate(-15vw, 25vh) scale(.9); }
  }
  h1 {
    position: fixed;
    inset: 0;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 0 5vw;
    color: #fff;
    font: 600 clamp(2rem, 7vw, 5rem)/1.1 system-ui, -apple-system, sans-serif;
    letter-spacing: -.02em;
    text-transform: lowercase;
  }
</style>
</head>
<body>
  <div class="bg">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
    <div class="blob b4"></div>
  </div>
  <h1>ekrem arda gümüş</h1>
</body>
</html>
